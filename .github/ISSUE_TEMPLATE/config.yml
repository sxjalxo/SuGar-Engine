blank_issues_enabled: false
contact_links:
  - name: Question, idea, or something you built
    url: https://github.com/sxjalxo/SuGar-Engine/discussions
    about: Use Discussions for questions and show-and-tell. Issues are for defects and capability requests.
  - name: Security vulnerability
    url: https://github.com/sxjalxo/SuGar-Engine/security/advisories/new
    about: Never report a vulnerability in a public issue. Use a private security advisory — see SECURITY.md.
  - name: Build fails, or the engine crashes at startup
    url: https://github.com/sxjalxo/SuGar-Engine/blob/main/CONTRIBUTING.md#toolchain-traps-that-cost-real-time
    about: "Three known traps cover most of these: configure twice, a stale Game.dll, and reading crashes/crash_*.txt. Check them first."
  - name: Code of Conduct concern
    url: https://github.com/sxjalxo/SuGar-Engine/blob/main/CODE_OF_CONDUCT.md
    about: Report privately to sujalgarje@gmail.com.
